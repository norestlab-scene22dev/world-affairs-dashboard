<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界情勢 × 成長産業ダッシュボード</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171d2b;
    --panel-alt: #1e2536;
    --border: #2a3348;
    --text: #e8ecf4;
    --text-dim: #8b94a8;
    --accent: #4f9eff;
    --up: #3ecf8e;
    --down: #ff6b6b;
    --flat: #8b94a8;
    --radius: 10px;
  }
  body.theme-teal {
    --bg: #0b1615; --panel: #11201e; --panel-alt: #16302c; --border: #234039;
    --text: #e6f3f0; --text-dim: #8fada6; --accent: #2dd4bf; --up: #4ade80; --down: #fb7185; --flat: #8fada6;
  }
  body.theme-charcoal {
    --bg: #1a1613; --panel: #231e19; --panel-alt: #2c2520; --border: #3d332b;
    --text: #f3ece3; --text-dim: #a89a89; --accent: #f0a94e; --up: #7dd88a; --down: #f2685c; --flat: #a89a89;
  }
  body.theme-contrast {
    --bg: #000000; --panel: #101010; --panel-alt: #1a1a1a; --border: #333333;
    --text: #ffffff; --text-dim: #a0a0a0; --accent: #00e5ff; --up: #00ff9c; --down: #ff5252; --flat: #a0a0a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    margin: 0 0 4px 0;
  }
  header .sub {
    font-size: 12px;
    color: var(--text-dim);
  }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .meta-row { display: flex; gap: 18px; font-size: 12px; color: var(--text-dim); flex-wrap: wrap; justify-content: flex-end; }
  .theme-switch { display: flex; align-items: center; gap: 6px; }
  .theme-switch label { font-size: 11px; color: var(--text-dim); }
  .theme-switch select {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
  }
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 0;
    min-height: calc(100vh - 78px);
  }
  aside {
    border-right: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
    max-height: calc(100vh - 78px);
  }
  .sidebar-hint {
    font-size: 10.5px;
    color: var(--text-dim);
    margin-bottom: 12px;
    line-height: 1.6;
  }
  .sort-controls {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .sort-controls button {
    flex: 1;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 4px;
    font-size: 11px;
    border-radius: 6px;
    cursor: pointer;
  }
  .sort-controls button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .sector-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .sector-card:hover { border-color: var(--accent); }
  .sector-card.active { border-color: var(--accent); background: var(--panel-alt); }
  .sector-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sector-name { font-size: 13.5px; font-weight: 600; }
  .badge {
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    cursor: help;
  }
  .badge.up { color: var(--up); background: rgba(62,207,142,.12); }
  .badge.down { color: var(--down); background: rgba(255,107,107,.12); }
  .badge.flat { color: var(--flat); background: rgba(139,148,168,.12); }
  .sector-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .score-mini { font-size: 10.5px; color: var(--text-dim); margin-top: 6px; cursor: help; }

  main { padding: 22px 30px; overflow-y: auto; max-height: calc(100vh - 78px); }
  .section-title { font-size: 15px; font-weight: 700; margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill { font-size: 11px; color: var(--text-dim); font-weight: 400; }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12.5px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  .stock-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 8px;
  }
  .stock-tile {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
  }
  .stock-tile .company { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
  .stock-tile .ticker { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .stock-tile .price { font-size: 16px; font-weight: 700; margin: 4px 0; }
  .stock-tile .chg { font-size: 12px; font-weight: 700; cursor: help; }
  .stock-hint { font-size: 10.5px; color: var(--text-dim); margin-bottom: 20px; }

  .news-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab-btn {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 5px 14px;
    font-size: 12px;
    border-radius: 20px;
    cursor: pointer;
  }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .news-item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .news-item a { color: var(--text); text-decoration: none; font-size: 14px; font-weight: 600; }
  .news-item a:hover { color: var(--accent); }
  .news-meta { font-size: 11px; color: var(--text-dim); margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
  .news-original { font-size: 11px; font-weight: 400; color: var(--text-dim); margin-top: 3px; }
  .news-summary { font-size: 12.5px; color: var(--text-dim); margin-top: 8px; }
  .lang-tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 20px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
  }
  .sector-tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 20px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--accent);
  }

  .eval-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin: 20px 0 26px 0;
  }
  .eval-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 12px;
  }
  .eval-field label {
    font-size: 12px;
    color: var(--text-dim);
    display: block;
    margin-bottom: 6px;
  }
  .score-buttons { display: flex; gap: 5px; }
  .score-buttons button {
    flex: 1;
    padding: 6px 0;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .score-buttons button.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .eval-notes {
    width: 100%;
    margin-top: 14px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    resize: vertical;
    min-height: 60px;
    font-family: inherit;
  }
  .eval-total { margin-top: 14px; font-size: 12.5px; color: var(--text-dim); }
  .eval-total b { color: var(--text); font-size: 15px; }

  .empty-state { color: var(--text-dim); font-size: 13px; padding: 30px 0; text-align: center; }
  .refresh-hint {
    font-size: 11px;
    color: var(--text-dim);
    background: var(--panel-alt);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 18px;
  }
  code { background: var(--panel-alt); padding: 1px 5px; border-radius: 4px; }

  .summary-panel {
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, transparent), color-mix(in srgb, var(--accent) 2%, transparent));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 22px;
  }
  .summary-panel .headline { font-size: 13.5px; line-height: 1.7; }
  .summary-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .summary-tag {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  #gate {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .hidden { display: none !important; }
  .gate-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 30px;
    width: 300px;
    text-align: center;
  }
  .gate-box h2 { font-size: 15px; margin: 0 0 6px 0; }
  .gate-box p { font-size: 12px; color: var(--text-dim); margin: 0 0 18px 0; }
  .gate-box input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-alt);
    color: var(--text);
    font-size: 14px;
    margin-bottom: 12px;
  }
  .gate-box button {
    width: 100%;
    padding: 10px 0;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .gate-error { color: var(--down); font-size: 11.5px; margin-top: 10px; min-height: 14px; }

  /* ===== スマホ対応 ===== */
  @media (max-width: 768px) {
    header { padding: 14px 16px; }
    header h1 { font-size: 16px; }
    .header-right { align-items: flex-start; width: 100%; }
    .meta-row { justify-content: flex-start; font-size: 11px; gap: 12px; }
    .layout { grid-template-columns: 1fr; min-height: auto; }
    aside {
      border-right: none;
      border-bottom: 1px solid var(--border);
      max-height: none;
      padding: 12px;
    }
    #sector-list { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
    .sector-card { min-width: 190px; flex: 0 0 auto; margin-bottom: 0; }
    main { padding: 16px; max-height: none; overflow-y: visible; }
    .eval-grid { grid-template-columns: 1fr; }
    .stock-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .section-title { font-size: 14px; }
  }
</style>
</head>
<body class="theme-midnight">

<div id="gate">
  <div class="gate-box">
    <h2>世界情勢ダッシュボード</h2>
    <p>合言葉を入力してください</p>
    <input type="password" id="gate-input" placeholder="パスワード" autocomplete="off">
    <button id="gate-submit">開く</button>
    <div class="gate-error" id="gate-error"></div>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <div>
    <h1>世界情勢 × 成長産業ダッシュボード</h1>
    <div class="sub">日本成長戦略「戦略17分野」を軸に、国内外ニュースと株価インパクトを一望</div>
  </div>
  <div class="header-right">
    <div class="meta-row">
      <span>ニュース更新: <span id="news-updated">-</span></span>
      <span>株価更新: <span id="stocks-updated">-</span></span>
    </div>
    <div class="theme-switch">
      <label for="theme-select">カラー</label>
      <select id="theme-select">
        <option value="midnight">ミッドナイトブルー</option>
        <option value="teal">スレートティール</option>
        <option value="charcoal">ウォームチャコール</option>
        <option value="contrast">ハイコントラスト</option>
      </select>
    </div>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-hint">% は各分野の代表銘柄の平均前日比騰落率、自己評価スコアは成長株4条件（①市場成長性②市場シェア③参入障壁④マネタイズ力）の1〜5点の平均です</div>
    <div class="sort-controls">
      <button data-sort="impact" class="active">株価インパクト順</button>
      <button data-sort="name">分野名順</button>
      <button data-sort="score">自己評価順</button>
    </div>
    <div id="sector-list"></div>
  </aside>

  <main id="main-content">
    <div class="empty-state">左のリストから分野を選択してください</div>
  </main>
</div>
</div><!-- /#app -->

<script>
  const DATA_FILES = {
  sectors: 'data/sectors.json',
  news: 'data/news.json',
  stocks: 'data/stocks.json',
  summary: 'data/summary.json',
};
const STORAGE_KEY = 'growth_eval_v1';

let sectorsDef = [];
let newsData = { items: [] };
let stocksData = { sectors: [] };
let summaryData = null;
let currentSort = 'impact';
let activeSectorId = null;
let newsLangFilter = 'all'; // all / ja / en
// ===== アクセス制限（簡易共通パスワード） =====
// パスワードを変更したい場合は、ターミナルで以下を実行してハッシュ値を作り、
// PASSWORD_HASH を書き換えてください（家族内共有用の簡易ゲートです。厳密なセキュリティ用途ではありません）。
//   echo -n "新しいパスワード" | shasum -a 256
const PASSWORD_HASH = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"; // デフォルト: "password"

async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function tryUnlock(pw) {
  const hash = await sha256Hex(pw);
  return hash === PASSWORD_HASH;
}

function showApp() {
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  init();
}

(function initGate() {
  if (localStorage.getItem('gate_unlocked') === 'true') {
    showApp();
    return;
  }
  const input = document.getElementById('gate-input');
  const submit = document.getElementById('gate-submit');
  const errorEl = document.getElementById('gate-error');

  async function attempt() {
    const ok = await tryUnlock(input.value);
    if (ok) {
      localStorage.setItem('gate_unlocked', 'true');
      showApp();
    } else {
      errorEl.textContent = 'パスワードが違います';
      input.value = '';
      input.focus();
    }
  }
  submit.addEventListener('click', attempt);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') attempt(); });
})();

// ===== カラーテーマ =====
const THEME_KEY = 'dashboard_theme_v1';
function applyTheme(name) {
  document.body.className = 'theme-' + name;
  localStorage.setItem(THEME_KEY, name);
}
(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY) || 'midnight';
  applyTheme(saved);
  const sel = document.getElementById('theme-select');
  if (sel) sel.value = saved;
})();
document.addEventListener('DOMContentLoaded', () => {
  const sel = document.getElementById('theme-select');
  if (sel) sel.addEventListener('change', (e) => applyTheme(e.target.value));
});



function loadEvalStore() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveEvalStore(store) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
}

async function fetchJSON(path) {
  try {
    const res = await fetch(path + '?_=' + Date.now());
    if (!res.ok) throw new Error(res.statusText);
    return await res.json();
  } catch (e) {
    console.warn('読み込み失敗:', path, e);
    return null;
  }
}

function fmtTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function relTime(iso) {
  if (!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const h = Math.floor(diffMs / 3600000);
  if (h < 1) return '1時間以内';
  if (h < 24) return `${h}時間前`;
  return `${Math.floor(h / 24)}日前`;
}

function changeClass(pct) {
  if (pct === null || pct === undefined) return 'flat';
  if (pct > 0.05) return 'up';
  if (pct < -0.05) return 'down';
  return 'flat';
}

function getSectorStock(sectorId) {
  return (stocksData.sectors || []).find(s => s.sector_id === sectorId);
}

function getSectorScore(sectorId) {
  const store = loadEvalStore();
  const e = store[sectorId];
  if (!e) return null;
  const vals = [e.market_growth, e.market_share, e.entry_barrier, e.monetization].filter(v => v);
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function renderSectorList() {
  const container = document.getElementById('sector-list');
  let list = [...sectorsDef];

  if (currentSort === 'impact') {
    list.sort((a, b) => {
      const sa = getSectorStock(a.id);
      const sb = getSectorStock(b.id);
      const va = sa && sa.avg_change_pct !== null && sa.avg_change_pct !== undefined ? Math.abs(sa.avg_change_pct) : -1;
      const vb = sb && sb.avg_change_pct !== null && sb.avg_change_pct !== undefined ? Math.abs(sb.avg_change_pct) : -1;
      return vb - va;
    });
  } else if (currentSort === 'name') {
    list.sort((a, b) => a.name_ja.localeCompare(b.name_ja, 'ja'));
  } else if (currentSort === 'score') {
    list.sort((a, b) => (getSectorScore(b.id) || -1) - (getSectorScore(a.id) || -1));
  }

  container.innerHTML = list.map(sector => {
    const stock = getSectorStock(sector.id);
    const pct = stock ? stock.avg_change_pct : null;
    const cls = changeClass(pct);
    const pctLabel = pct === null || pct === undefined ? 'N/A' : `${pct > 0 ? '+' : ''}${pct}%`;
    const score = getSectorScore(sector.id);
    const newsCount = newsData.items.filter(n => n.sector_id === sector.id).length;
    return `
      <div class="sector-card ${sector.id === activeSectorId ? 'active' : ''}" data-id="${sector.id}">
        <div class="sector-card-top">
          <div class="sector-name">${sector.name_ja}</div>
          <div class="badge ${cls}" title="代表銘柄の平均前日比騰落率">${pctLabel}</div>
        </div>
        <div class="sector-sub">${sector.name_en} ・ ニュース${newsCount}件</div>
        ${score !== null ? `<div class="score-mini" title="成長株4条件(市場成長性/市場シェア/参入障壁/マネタイズ力)の自己評価スコア、1〜5の平均">自己評価スコア: ${score.toFixed(1)} / 5</div>` : ''}
      </div>`;
  }).join('');

  container.querySelectorAll('.sector-card').forEach(el => {
    el.addEventListener('click', () => {
      activeSectorId = el.dataset.id;
      renderSectorList();
      renderMain();
    });
  });
}

function evalFieldRow(label, key, sectorId, currentVal) {
  const buttons = [1, 2, 3, 4, 5].map(v =>
    `<button data-key="${key}" data-val="${v}" class="${currentVal === v ? 'selected' : ''}">${v}</button>`
  ).join('');
  return `
    <div class="eval-field">
      <label>${label}</label>
      <div class="score-buttons" data-key="${key}">${buttons}</div>
    </div>`;
}

function renderEvalPanel(sector) {
  const store = loadEvalStore();
  const e = store[sector.id] || {};
  const total = getSectorScore(sector.id);

  return `
    <div class="eval-panel">
      <div class="section-title">成長株4条件 自己評価 <span class="pill">①市場成長性 ②市場シェア ③参入障壁 ④マネタイズ力 / 各項目1(弱い)〜5(強い)で自己評価・保存は自動でブラウザのlocalStorageに保持</span></div>
      <div class="eval-grid">
        ${evalFieldRow('① 市場成長性', 'market_growth', sector.id, e.market_growth)}
        ${evalFieldRow('② 市場シェア(占有率)', 'market_share', sector.id, e.market_share)}
        ${evalFieldRow('③ 参入障壁', 'entry_barrier', sector.id, e.entry_barrier)}
        ${evalFieldRow('④ マネタイズ力', 'monetization', sector.id, e.monetization)}
      </div>
      <textarea class="eval-notes" id="eval-notes" placeholder="メモ・関連ニュースの所感など">${e.notes || ''}</textarea>
      <div class="eval-total">総合スコア（4項目の平均）: <b>${total !== null ? total.toFixed(1) : '-'} / 5</b></div>
    </div>`;
}

function bindEvalPanel(sector) {
  document.querySelectorAll('.score-buttons').forEach(group => {
    group.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const store = loadEvalStore();
        store[sector.id] = store[sector.id] || {};
        store[sector.id][group.dataset.key] = parseInt(btn.dataset.val, 10);
        saveEvalStore(store);
        renderMain();
        renderSectorList();
      });
    });
  });
  const notes = document.getElementById('eval-notes');
  if (notes) {
    notes.addEventListener('input', () => {
      const store = loadEvalStore();
      store[sector.id] = store[sector.id] || {};
      store[sector.id].notes = notes.value;
      saveEvalStore(store);
    });
  }
}

function renderStockGrid(sector) {
  const stock = getSectorStock(sector.id);
  if (!stock || !stock.stocks.length) return '<div class="empty-state">株価データがありません。fetch_stocks.py を実行してください。</div>';
  return `
    <div class="stock-grid">` + stock.stocks.map(s => `
    <div class="stock-tile">
      <div class="company">${s.name || s.ticker}</div>
      <div class="ticker">${s.ticker}</div>
      <div class="price">${s.price} ${s.currency || ''}</div>
      <div class="chg ${changeClass(s.change_pct)}" title="前日比騰落率">${s.change_pct > 0 ? '+' : ''}${s.change_pct}%</div>
    </div>`).join('') + `</div>
    <div class="stock-hint">この分野の代表銘柄（会社名・ティッカー）と前日比の株価騰落率です</div>`;
}

function newsTitleHtml(n) {
  if (n.title_ja && n.title_ja !== n.title) {
    return `${n.title_ja}<div class="news-original">${n.title}</div>`;
  }
  return n.title;
}

function filterByLang(items) {
  if (newsLangFilter === 'all') return items;
  return items.filter(n => n.lang === newsLangFilter);
}

function newsTabsHtml() {
  const tabs = [
    { key: 'all', label: 'すべて' },
    { key: 'ja', label: '日本' },
    { key: 'en', label: '海外' },
  ];
  return `<div class="news-tabs">${tabs.map(t =>
    `<button class="tab-btn ${newsLangFilter === t.key ? 'active' : ''}" data-lang="${t.key}">${t.label}</button>`
  ).join('')}</div>`;
}

function bindNewsTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      newsLangFilter = btn.dataset.lang;
      renderMain();
    });
  });
}

function renderNewsList(sectorId) {
  const items = filterByLang(newsData.items.filter(n => n.sector_id === sectorId));
  if (!items.length) return '<div class="empty-state">該当するニュースがありません。</div>';
  return items.map(n => `
    <div class="news-item">
      <a href="${n.link}" target="_blank" rel="noopener">${newsTitleHtml(n)}</a>
      <div class="news-meta">
        <span class="lang-tag">${n.lang === 'en' ? '海外' : '日本'}</span>
        <span>${n.source}</span>
        <span>${relTime(n.published)} (${fmtTime(n.published)})</span>
      </div>
      ${n.summary ? `<div class="news-summary">${n.summary}</div>` : ''}
    </div>`).join('');
}

function renderSummaryPanel() {
  if (!summaryData || !summaryData.headline) return '';
  const sectorMap = Object.fromEntries(sectorsDef.map(s => [s.id, s.name_ja]));
  const tags = [
    ...(summaryData.top_count_sectors || []).map(id => `報道量: ${sectorMap[id] || id}`),
    ...(summaryData.top_impact_sectors || []).map(id => `株価: ${sectorMap[id] || id}`),
  ];
  return `
    <div class="summary-panel">
      <div class="section-title" style="margin-bottom:6px;">本日のサマリ <span class="pill">キーワード集計・自動生成 / ${fmtTime(summaryData.generated_at)}時点</span></div>
      <div class="headline">${summaryData.headline}</div>
      ${tags.length ? `<div class="summary-tags">${tags.map(t => `<span class="summary-tag">${t}</span>`).join('')}</div>` : ''}
    </div>`;
}

function renderSectorSummaryPanel(sectorId) {
  if (!summaryData || !summaryData.sectors) return '';
  const s = summaryData.sectors.find(x => x.sector_id === sectorId);
  if (!s || !s.headline) return '';
  return `
    <div class="summary-panel">
      <div class="section-title" style="margin-bottom:6px;">この分野のサマリ <span class="pill">キーワード集計・自動生成</span></div>
      <div class="headline">${s.headline}</div>
    </div>`;
}

function renderOverview() {
  const sorted = [...(stocksData.sectors || [])].filter(s => s.avg_change_pct !== null)
    .sort((a, b) => Math.abs(b.avg_change_pct) - Math.abs(a.avg_change_pct)).slice(0, 5);

  const topMoversHtml = sorted.length ? sorted.map(s => `
    <div class="stock-tile">
      <div class="company">${s.name_ja}</div>
      <div class="chg ${changeClass(s.avg_change_pct)}" title="分野内・代表銘柄の平均前日比騰落率" style="font-size:16px;margin-top:6px;">
        ${s.avg_change_pct > 0 ? '+' : ''}${s.avg_change_pct}%
      </div>
    </div>`).join('') : '<div class="empty-state">株価データがありません</div>';

  const latestNews = filterByLang([...newsData.items]).slice(0, 12);
  const sectorMap = Object.fromEntries(sectorsDef.map(s => [s.id, s.name_ja]));
  const newsHtml = latestNews.length ? latestNews.map(n => `
    <div class="news-item">
      <span class="sector-tag">${sectorMap[n.sector_id] || n.sector_id}</span>
      <span class="lang-tag" style="margin-left:6px;">${n.lang === 'en' ? '海外' : '日本'}</span>
      <div style="margin-top:8px;"><a href="${n.link}" target="_blank" rel="noopener">${newsTitleHtml(n)}</a></div>
      <div class="news-meta"><span>${n.source}</span><span>${relTime(n.published)}</span></div>
      ${n.summary ? `<div class="news-summary">${n.summary}</div>` : ''}
    </div>`).join('') : '<div class="empty-state">該当するニュースがありません。</div>';

  return `
    <div class="refresh-hint">
      表示中は保存済みのデータです。GitHub Actionsで自動更新している場合は毎朝8時(JST)に最新化されます。
      手元で今すぐ更新したい場合はターミナルで <code>python scripts/fetch_news.py</code>、
      <code>python scripts/fetch_stocks.py</code>、<code>python scripts/generate_summary.py</code> を実行してください。
    </div>
    ${renderSummaryPanel()}
    <div class="section-title">株価インパクト上位分野 <span class="pill" title="各分野の代表銘柄の平均前日比騰落率(|値|が大きい順)">|平均騰落率| が大きい順</span></div>
    <div class="stock-grid">${topMoversHtml}</div>
    <div class="section-title">最新ニュース（全分野横断）</div>
    ${newsTabsHtml()}
    ${newsHtml}`;
}

function renderMain() {
  const main = document.getElementById('main-content');
  if (!activeSectorId) {
    main.innerHTML = renderOverview();
    bindNewsTabs();
    return;
  }
  const sector = sectorsDef.find(s => s.id === activeSectorId);
  if (!sector) { main.innerHTML = '<div class="empty-state">分野が見つかりません</div>'; return; }

  main.innerHTML = `
    <button class="back-btn" id="back-to-top">← 全体表示に戻る</button>
    <div class="section-title">${sector.name_ja} <span class="pill">${sector.name_en}</span></div>
    <div class="sector-sub" style="margin-bottom:16px;">対象: ${sector.subfields.join(' / ')}</div>
    ${renderSectorSummaryPanel(sector.id)}
    ${renderStockGrid(sector)}
    ${renderEvalPanel(sector)}
    <div class="section-title">関連ニュース</div>
    ${newsTabsHtml()}
    ${renderNewsList(sector.id)}
  `;
  bindEvalPanel(sector);
  bindNewsTabs();
  const backBtn = document.getElementById('back-to-top');
  if (backBtn) {
    backBtn.addEventListener('click', () => {
      activeSectorId = null;
      renderSectorList();
      renderMain();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
}

document.querySelectorAll('.sort-controls button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentSort = btn.dataset.sort;
    document.querySelectorAll('.sort-controls button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderSectorList();
  });
});

async function init() {
  const [sectorsRes, news, stocks, summary] = await Promise.all([
    fetchJSON(DATA_FILES.sectors),
    fetchJSON(DATA_FILES.news),
    fetchJSON(DATA_FILES.stocks),
    fetchJSON(DATA_FILES.summary),
  ]);
  sectorsDef = sectorsRes ? sectorsRes.sectors : [];
  newsData = news || { items: [] };
  stocksData = stocks || { sectors: [] };
  summaryData = summary || null;

  document.getElementById('news-updated').textContent = news ? fmtTime(news.generated_at) : '未取得';
  document.getElementById('stocks-updated').textContent = stocks ? fmtTime(stocks.generated_at) : '未取得';

  renderSectorList();
  renderMain();
}
// init() は #gate 通過後（showApp内）で呼び出されます
</script>
</body>
</html>
